name: veri-restore-test

# ForzaLig — GERÇEK veri/row restore kanıtı (ÜCRETSIZ, öz-yeterli).
# Boş bir Postgres'e REPODAN şema + migration + hayali veri (seed) yükler ve
# satırların gerçekten geri geldiğini doğrular. "Şemam kurulur" değil,
# "VERİM de geri yüklenir" kanıtı. Staging'e/prod'a DOKUNMAZ.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 5 * * 1'   # her Pazartesi 05:00 UTC

jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: psql kur
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Yapı + veri geri yükle
        run: |
          set -e
          psql -v ON_ERROR_STOP=0 -c "SET check_function_bodies=off;" \
            -f supabase/restore/supabase-shim.sql \
            -f supabase/restore/_canli_schema_2026-08-19.sql 2> /tmp/str.log
          for f in $(ls supabase/migrations/*.sql | grep -v _rollback | sort); do
            psql -v ON_ERROR_STOP=0 -c "SET check_function_bodies=off;" -f "$f" 2>> /tmp/str.log || true
          done
          # Veri (INSERT-guard trigger'ları veriyi engellemesin diye kapat)
          psql -v ON_ERROR_STOP=0 -c "set session_replication_role=replica;" -f supabase/restore/seed-staging.sql 2> /tmp/seed.log
      - name: Doğrula (satırlar geri geldi mi?)
        run: |
          set -e
          echo "| Tablo | Satır |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          FAIL=0
          for t in ligler takimlar oyuncular oyuncu_takim maclar mac_olaylari sohbet_mesajlari; do
            N=$(psql -Atqc "select count(*) from public.$t" 2>/dev/null || echo 0)
            echo "| $t | $N |" >> $GITHUB_STEP_SUMMARY
            echo "$t = $N"
            if [ "${N:-0}" -lt 1 ]; then echo "HATA: $t boş"; FAIL=1; fi
          done
          if [ "$FAIL" = "1" ]; then echo "### ❌ VERİ RESTORE: FAIL" >> $GITHUB_STEP_SUMMARY; exit 1; fi
          echo "### ✅ VERİ RESTORE: PASS" >> $GITHUB_STEP_SUMMARY
          echo "✅ VERİ RESTORE: PASS — tüm anahtar tablolar satır döndürdü."

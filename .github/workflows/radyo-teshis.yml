name: radyo-teshis

# ForzaLig — CANLI radyo kök-neden teşhisi (Cloudflare arkasındaki gerçek site).
# Production'a YAZMAZ; yalnız dışarıdan gözlemler. Elle tetiklenir.

on: { workflow_dispatch: {} }

jobs:
  teshis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Playwright + Chromium
        run: |
          npm install --no-save playwright@1.48.0
          npx playwright install --with-deps chromium
      - name: Canlı radyo teşhisi
        run: node scripts/radyo-teshis.mjs

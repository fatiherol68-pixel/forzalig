name: staging-e2e

# ForzaLig — Staging şema+seed+E2E (ÜCRETSIZ, secret gelince çalışır).
# Gerekli GitHub Secrets:
#   STAGING_DB_URL   = postgresql://postgres:<sifre>@db.<ref>.supabase.co:5432/postgres
#   STAGING_URL      = https://<ref>.supabase.co
#   STAGING_ANON_KEY = sb_publishable_...
# Bunlar yoksa iş sessizce atlar (FAIL vermez). Production'a DOKUNMAZ.
# Admin E2E kullanıcısı yalnız STAGING veritabanında oluşturulur/yetkilendirilir.

on: { workflow_dispatch: {} }

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_EMAIL: e2e_admin_${{ github.run_id }}@test.local
      E2E_PASS: E2eGuclu!2026
    steps:
      - uses: actions/checkout@v4
      - name: Secret kontrolü
        id: k
        run: |
          if [ -n "${{ secrets.STAGING_DB_URL }}" ] && [ -n "${{ secrets.STAGING_URL }}" ] && [ -n "${{ secrets.STAGING_ANON_KEY }}" ]; then
            echo "hazir=evet" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=hayir" >> "$GITHUB_OUTPUT"; echo "::notice::Staging secret'ları yok — atlandı."
          fi
      - name: psql kur
        if: steps.k.outputs.hazir == 'evet'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Staging'e şema + migration + seed uygula
        if: steps.k.outputs.hazir == 'evet'
        env: { PGURL: "${{ secrets.STAGING_DB_URL }}" }
        run: |
          set -e
          # Direkt DB IPv6-only → IPv4 connection pooler (Frankfurt)
          PGURL=$(echo "$PGURL" | sed -E 's#postgresql://postgres:([^@]+)@db\.([a-z0-9]+)\.supabase\.co:5432/postgres#postgresql://postgres.\2:\1@aws-0-eu-central-1.pooler.supabase.com:5432/postgres#')
          psql "$PGURL" -c "select 1" >/dev/null   # bağlantı gerçekten kurulmalı (sessiz geçme yok)
          psql "$PGURL" -v ON_ERROR_STOP=0 -c "SET check_function_bodies=off;" -f supabase/restore/_canli_schema_2026-08-19.sql 2> /tmp/s.log || true
          for f in $(ls supabase/migrations/*.sql | grep -v _rollback | sort); do psql "$PGURL" -v ON_ERROR_STOP=0 -c "SET check_function_bodies=off;" -f "$f" 2>>/tmp/s.log || true; done
          psql "$PGURL" -v ON_ERROR_STOP=0 -f supabase/restore/seed-staging.sql 2>>/tmp/s.log || true
          echo "şema+seed uygulandı (hatalar /tmp/s.log)"
      - name: E2E admin kullanıcısı (yalnız STAGING) oluştur + yetkilendir
        if: steps.k.outputs.hazir == 'evet'
        env:
          PGURL: "${{ secrets.STAGING_DB_URL }}"
          SB: "${{ secrets.STAGING_URL }}"
          KEY: "${{ secrets.STAGING_ANON_KEY }}"
        run: |
          set -e
          PGURL=$(echo "$PGURL" | sed -E 's#postgresql://postgres:([^@]+)@db\.([a-z0-9]+)\.supabase\.co:5432/postgres#postgresql://postgres.\2:\1@aws-0-eu-central-1.pooler.supabase.com:5432/postgres#')
          # Kullanıcıyı auth üzerinden oluştur (auto-confirm açık → session döner)
          curl -s -X POST "$SB/auth/v1/signup" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASS\"}" -o /tmp/reg.json || true
          # Admin yap: auth.users'tan id bul → public.adminler'e ekle (yalnız staging)
          psql "$PGURL" -v ON_ERROR_STOP=0 -c \
            "insert into public.adminler(user_id) select id from auth.users where email='$E2E_EMAIL' and not exists (select 1 from public.adminler a where a.user_id=auth.users.id);" 2>/tmp/adm.log || true
          N=$(psql "$PGURL" -Atqc "select count(*) from public.adminler ad join auth.users u on u.id=ad.user_id where u.email='$E2E_EMAIL'" 2>/dev/null || echo 0)
          echo "admin kaydı: $N (1 bekleniyor)"
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Staging anahtarlı build (refactor dalı kaynağı)
        if: steps.k.outputs.hazir == 'evet'
        run: |
          set -e
          git fetch origin claude/faz5-8-refactor --depth=1
          git worktree add /tmp/ref origin/claude/faz5-8-refactor
          cd /tmp/ref
          # prod anahtarlarını staging ile değiştir (yalnız build kopyasında)
          sed -i "s#https://crkestykdsnmfcmamxav.supabase.co#${{ secrets.STAGING_URL }}#g" index.html
          sed -i "s#sb_publishable_sjfSVp0CmfnB4g8GecB0eA_BCHZheFB#${{ secrets.STAGING_ANON_KEY }}#g" index.html
          # ÖNCE bağımlılıkları kur (uret.mjs artık @babel/parser kullanıyor), SONRA üret+derle
          (cd vite-app && npm install --no-audit --no-fund)
          node vite-app/uret.mjs
          (cd vite-app && npm run build)
          cp -r vite-app/dist /tmp/site
      - name: Serve + E2E
        if: steps.k.outputs.hazir == 'evet'
        env:
          STAGING_URL: "${{ secrets.STAGING_URL }}"
          STAGING_ANON_KEY: "${{ secrets.STAGING_ANON_KEY }}"
          E2E_ADMIN: '1'
        run: |
          npm install --no-save playwright@1.48.0
          npx playwright install --with-deps chromium
          (cd /tmp/site && python3 -m http.server 8080 &) ; sleep 3
          E2E_BASE=http://localhost:8080 node scripts/e2e.mjs
